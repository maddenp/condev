{% set info = load_file_data("hello/resources/info.json") %}

package:
  name: hello
  version: {{ info["version"] }}
source:
  path: ../src
build:
  include_recipe: false
  number: {{ info["buildnum"] }}
requirements:
  build:
    - make
    - {{ compiler('c') }}
  host:
    - pip
    - python
    - setuptools
  run:
    - python
test:
  requires:
    - jq
    - mypy
    - pytest
    - pytest-cov
    - ruff
about: 
  license: OTHER
